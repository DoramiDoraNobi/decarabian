[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "decarabian"
version = "0.1.0"
authors = [
  { name="Decarabian Technologies" },
]
description = "Official Python SDK for Decarabian AI Security Gateway"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.25.1",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/decarabian/python-sdk"
